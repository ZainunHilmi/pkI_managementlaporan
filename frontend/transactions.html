<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D97757">
  <meta name="description" content="Log transaksi sparepart — audit trail barang masuk & keluar.">
  <title>Log Transaksi - Sparepart Management</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body>
  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">🔧</div>
        <div class="sidebar-brand-text">
          Sparepart
          <small>Management System</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Menu</div>
          <a href="dashboard.html" class="sidebar-link" id="nav-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </a>
          <a href="catalog.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Katalog Sparepart
          </a>
          <a href="transactions.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Log Transaksi
          </a>
        </div>
        <div class="sidebar-section" id="admin-nav" style="display:none">
          <div class="sidebar-section-title">Admin</div>
          <a href="manage-sparepart.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Kelola Sparepart
          </a>
          <a href="manage-users.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Kelola Pengguna
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebar-avatar">BU</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Budi Mekanik</div>
            <div class="sidebar-user-role" id="sidebar-role">Mekanik</div>
          </div>
          <button class="btn btn-ghost btn-icon" onclick="handleLogout()" title="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="topbar-title">Log Transaksi</h1>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" id="addTxBtn" onclick="openAddTxModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tambah Transaksi
          </button>
        </div>
      </header>

      <div class="page-content fade-in">
        <div class="toolbar-mobile">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="tx-search-m" placeholder="Cari part, mekanik…" aria-label="Cari transaksi">
          </div>
        </div>
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" onclick="filterTx('all', this)">Semua</button>
          <button class="tab-btn" onclick="filterTx('in', this)">Barang Masuk</button>
          <button class="tab-btn" onclick="filterTx('out', this)">Barang Keluar</button>
        </div>

        <!-- Table -->
        <div class="card">
          <div class="card-header">
            <div class="search-box" style="width:100%;max-width:320px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="tx-search" placeholder="Cari part, mekanik, atau keterangan..." autocomplete="off" aria-label="Cari transaksi">
            </div>
            <span class="badge badge-gray" id="tx-count">0 transaksi</span>
          </div>
          <div class="table-container">
            <table id="tx-table">
              <thead>
                <tr>
                  <th>No</th>
                  <th>Tanggal & Waktu</th>
                  <th>Sparepart</th>
                  <th>Tipe</th>
                  <th>Jumlah</th>
                  <th>Mekanik</th>
                  <th>Keterangan</th>
                </tr>
              </thead>
              <tbody id="tx-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Transaction Modal -->
  <div class="modal-overlay" id="addTxModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Tambah Transaksi</span>
        <button class="modal-close" onclick="closeModal('addTxModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Sparepart *</label>
          <select class="form-select" id="txPartId" required>
            <option value="">-- Pilih Sparepart --</option>
          </select>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem">
          <div class="form-group">
            <label>Tipe Transaksi *</label>
            <select class="form-select" id="txType" required>
              <option value="in">Barang Masuk</option>
              <option value="out">Barang Keluar</option>
            </select>
          </div>
          <div class="form-group">
            <label>Jumlah *</label>
            <input type="number" class="form-input" id="txQty" min="1" value="1" required>
          </div>
        </div>
        <div class="form-group">
          <label>Keterangan *</label>
          <textarea class="form-textarea" id="txNotes" placeholder="Contoh: Restok dari supplier / Penggantian untuk mesin A" required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('addTxModal')">Batal</button>
        <button class="btn btn-primary" onclick="submitTx()">Simpan Transaksi</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <nav class="bottom-nav" aria-label="Navigasi bawah">
    <a href="dashboard.html" id="bn-dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="catalog.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>Katalog</a>
    <a href="transactions.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Transaksi</a>
  </nav>

  <script src="assets/js/app.js"></script>
  <script>
    let currentTxFilter = 'all';

    const _u3 = requireAuth();
    if (_u3) {
      paintUserChip();
      if (_u3.role === 'admin') {
        document.getElementById('admin-nav').style.display = 'block';
      } else {
        const bn = document.getElementById('bn-dashboard');
        if (bn) bn.style.display = 'none';
        document.getElementById('addTxBtn').style.display = 'none';
      }
    }
    document.getElementById('tx-search')?.addEventListener('input', debounce((e) => filterTable('tx-search', 'tx-table'), 200));
    document.getElementById('tx-search-m')?.addEventListener('input', (e) => {
      const d = document.getElementById('tx-search');
      if (d) { d.value = e.target.value; filterTable('tx-search', 'tx-table'); }
    });

    async function handleLogout() {
      await apiLogout();
      window.location.href = 'login.html';
    }

    async function renderTxTable(filter = 'all') {
      currentTxFilter = filter;
      const tbody = document.getElementById('tx-tbody');
      skeletonTable('tx-tbody', 7, 6);

      try {
        const txs = await fetchTransactions(filter);

        document.getElementById('tx-count').textContent = `${txs.length} transaksi`;
        document.getElementById('tx-count').dataset.locked = '1';

        if (!txs.length) {
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-ill">🧾</div><h3>Belum ada transaksi</h3><p>Transaksi akan muncul di sini setelah dicatat</p></div></td></tr>';
          return;
        }

        tbody.innerHTML = txs.map((tx, i) => `
          <tr>
            <td style="font-weight:700; color:var(--gray-300)">${i + 1}</td>
            <td style="white-space:nowrap">${escapeHtml(formatDate(tx.created_at))}</td>
            <td>
              <div style="font-weight:700">${escapeHtml(tx.sparepart ? tx.sparepart.name : tx.part_id)}</div>
              <div style="font-size:0.75rem; color:var(--gray-400)">${escapeHtml(tx.part_id)}</div>
            </td>
            <td>
              <span class="badge ${tx.type === 'in' ? 'badge-success' : 'badge-danger'}">
                <span class="badge-dot"></span>
                ${tx.type === 'in' ? 'Masuk' : 'Keluar'}
              </span>
            </td>
            <td>
              <span style="font-weight:800; color:${tx.type === 'in' ? 'var(--success-deep)' : 'var(--danger-deep)'}">
                ${tx.type === 'in' ? '+' : '−'}${formatNumber(tx.quantity)}
              </span>
            </td>
            <td>${escapeHtml(tx.user ? tx.user.name : 'Unknown')}</td>
            <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" title="${escapeHtml(tx.notes || '')}">${escapeHtml(tx.notes || '-')}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-ill">⚠️</div><h3>Gagal memuat data</h3><p>${escapeHtml(e.message || 'Pastikan server backend berjalan')}</p></div></td></tr>`;
      }
    }

    function filterTx(filter, el) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderTxTable(filter);
    }

    async function openAddTxModal() {
      const select = document.getElementById('txPartId');
      select.innerHTML = '<option value="">-- Pilih Sparepart --</option>';
      try {
        const parts = await fetchSpareparts();
        parts.forEach(p => {
          select.innerHTML += `<option value="${p.part_id}">${p.name} (${p.part_id}) - Stok: ${p.current_stock}</option>`;
        });
        document.getElementById('txType').value = 'in';
        document.getElementById('txQty').value = 1;
        document.getElementById('txNotes').value = '';
        openModal('addTxModal');
      } catch (e) {
        showToast('Gagal memuat daftar sparepart', 'error');
      }
    }

    async function submitTx() {
      const partId = document.getElementById('txPartId').value;
      const type = document.getElementById('txType').value;
      const qty = parseInt(document.getElementById('txQty').value);
      const notes = document.getElementById('txNotes').value.trim();

      if (!partId) { showToast('Pilih sparepart terlebih dahulu', 'error'); return; }
      if (!qty || qty < 1) { showToast('Jumlah tidak valid', 'error'); return; }
      if (!notes) { showToast('Keterangan wajib diisi', 'error'); return; }

      try {
        await createTransaction({ part_id: partId, type, quantity: qty, notes });
        closeModal('addTxModal');
        showToast(`Transaksi ${type === 'in' ? 'masuk' : 'keluar'} berhasil dicatat!`, 'success');
        renderTxTable(currentTxFilter);
      } catch (e) {
        showToast(e.message || 'Gagal mencatat transaksi', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => renderTxTable());
  </script>
</body>
</html>
