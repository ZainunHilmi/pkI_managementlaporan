<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D97757">
  <meta name="description" content="Katalog sparepart — cari cepat, lihat stok & lokasi rak.">
  <title>Katalog Sparepart - Sparepart Management</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body>
  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">🔧</div>
        <div class="sidebar-brand-text">
          Sparepart
          <small>Management System</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Menu</div>
          <a href="dashboard.html" class="sidebar-link" id="nav-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </a>
          <a href="catalog.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Katalog Sparepart
          </a>
          <a href="transactions.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Log Transaksi
          </a>
        </div>
        <div class="sidebar-section" id="admin-nav" style="display:none">
          <div class="sidebar-section-title">Admin</div>
          <a href="manage-sparepart.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Kelola Sparepart
          </a>
          <a href="manage-users.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Kelola Pengguna
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebar-avatar">BU</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Budi Mekanik</div>
            <div class="sidebar-user-role" id="sidebar-role">Mekanik</div>
          </div>
          <button class="btn btn-ghost btn-icon" onclick="handleLogout()" title="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="topbar-title">Katalog Sparepart</h1>
        </div>
        <div class="topbar-right">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="catalog-search" placeholder="Cari nama part atau ID..." autocomplete="off" aria-label="Cari sparepart">
          </div>
        </div>
      </header>

      <div class="page-content fade-in">
        <div class="toolbar-mobile">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="catalog-search-m" placeholder="Cari nama part atau ID..." aria-label="Cari sparepart">
          </div>
        </div>
        <!-- Filter Chips -->
        <div class="toolbar" role="tablist" aria-label="Filter stok">
          <button class="chip active" data-filter="all" onclick="filterByStock('all', this)">Semua Part</button>
          <button class="chip" data-filter="low" onclick="filterByStock('low', this)"><span class="badge-dot" style="background:var(--danger)"></span>Stok Menipis (≤3)</button>
          <button class="chip" data-filter="ok" onclick="filterByStock('ok', this)"><span class="badge-dot" style="background:var(--success)"></span>Stok Aman</button>
          <span class="result-count" id="result-count"></span>
        </div>

        <!-- Cards Grid -->
        <div class="grid-3" id="catalog-grid"></div>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-label="Detail sparepart">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Detail Sparepart</span>
        <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
      </div>
      <div class="modal-body" id="detailModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('detailModal')">Tutup</button>
        <button class="btn btn-primary" id="takePartBtn" onclick="openTakeModal()">Ambil Barang</button>
      </div>
    </div>
  </div>

  <!-- Take Part Modal -->
  <div class="modal-overlay" id="takeModal" role="dialog" aria-modal="true" aria-label="Catat pengambilan">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Catat Pengambilan</span>
        <button class="modal-close" onclick="closeModal('takeModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Sparepart</label>
          <input type="text" class="form-input" id="takePartName" readonly style="background:var(--gray-100)">
        </div>
        <div class="form-group">
          <label>Jumlah Diambil *</label>
          <input type="number" class="form-input" id="takeQty" min="1" value="1" required>
        </div>
        <div class="form-group">
          <label>Keterangan *</label>
          <textarea class="form-textarea" id="takeNotes" placeholder="Contoh: Penggantian bearing motor conveyor A3" required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('takeModal')">Batal</button>
        <button class="btn btn-danger" onclick="submitTake()">Konfirmasi Pengambilan</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <nav class="bottom-nav" aria-label="Navigasi bawah">
    <a href="dashboard.html" id="bn-dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="catalog.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>Katalog</a>
    <a href="transactions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Transaksi</a>
  </nav>

  <script src="assets/js/app.js"></script>
  <script>
    let selectedPartId = null;
    let currentFilter = 'all';
    let catalogCache = [];

    const _u2 = requireAuth();
    if (_u2) {
      paintUserChip();
      if (_u2.role === 'admin') {
        document.getElementById('admin-nav').style.display = 'block';
      } else {
        const nd = document.getElementById('nav-dashboard');
        if (nd) nd.style.display = 'none';
        const bn = document.getElementById('bn-dashboard');
        if (bn) bn.style.display = 'none';
      }
    }

    // Ambil ?q= dari dashboard search
    const _q = new URLSearchParams(window.location.search).get('q') || '';
    if (_q) {
      const a = document.getElementById('catalog-search');
      const b = document.getElementById('catalog-search-m');
      if (a) a.value = _q;
      if (b) b.value = _q;
    }

    async function handleLogout() {
      await apiLogout();
      window.location.href = 'login.html';
    }

    async function renderCatalog(filter = currentFilter) {
      currentFilter = filter;
      const grid = document.getElementById('catalog-grid');
      const q = (document.getElementById('catalog-search')?.value || document.getElementById('catalog-search-m')?.value || _q || '').trim();
      skeletonCards('catalog-grid', 6);
      try {
        // Server-side search bila backend baru; fallback client-filter bila backend lama
        let parts = [];
        try {
          parts = await fetchSpareparts({ ...(q ? { search: q } : {}), ...(filter !== 'all' ? { stock: filter } : {}) });
        } catch {
          parts = await fetchSpareparts();
          if (q) {
            const needle = q.toLowerCase();
            parts = parts.filter(p => `${p.name} ${p.part_id} ${p.location}`.toLowerCase().includes(needle));
          }
          if (filter === 'low') parts = parts.filter(p => p.current_stock <= 3);
          if (filter === 'ok') parts = parts.filter(p => p.current_stock > 3);
        }

        document.getElementById('result-count').textContent = `${parts.length} part ditampilkan`;
        catalogCache = parts;

        if (!parts.length) {
          grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-ill">📦</div><h3>${q ? `Tidak ketemu “${escapeHtml(q)}”` : 'Tidak ada sparepart'}</h3><p>Coba kata kunci lain atau reset filter stok.</p></div>`;
          return;
        }

        grid.innerHTML = parts.map(p => `
          <article class="sparepart-card" onclick="showDetail('${escapeHtml(p.part_id)}')" tabindex="0" onkeydown="if(event.key==='Enter'&&!event.target.closest('button'))showDetail('${escapeHtml(p.part_id)}')" aria-label="${escapeHtml(p.name)}">
            <div class="sparepart-img-wrap">
              <div class="sparepart-img">
                ${p.image_url
                  ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.remove()">`
                  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>'
                }
              </div>
              ${p.image_url ? `<button type="button" class="img-view-btn" onclick="event.stopPropagation(); viewCatalogImage('${escapeHtml(p.part_id)}')" title="Lihat gambar ${escapeHtml(p.name)} (terpisah dari detail)" aria-label="Lihat gambar ${escapeHtml(p.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>Lihat</button>` : ''}
            </div>
            <div class="sparepart-info">
              <div class="sparepart-id">${escapeHtml(p.part_id)}</div>
              <div class="sparepart-name">${escapeHtml(p.name)}</div>
              <div class="sparepart-meta">
                <div class="sparepart-location">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${escapeHtml(p.location)}
                </div>
                <div class="sparepart-stock">
                  <div>
                    <div class="stock-count ${p.current_stock <= 3 ? 'low' : 'ok'}">${formatNumber(p.current_stock)}</div>
                    <div class="stock-label">stok</div>
                  </div>
                </div>
              </div>
              ${p.current_stock <= 3 ? '<div style="margin-top:0.6rem"><span class="badge badge-danger"><span class="badge-dot"></span> Stok Menipis</span></div>' : ''}
              <div class="sparepart-actions">
                <button type="button" class="btn btn-outline btn-sm" onclick="event.stopPropagation(); showDetail('${escapeHtml(p.part_id)}')">Detail</button>
                ${p.image_url
                  ? `<button type="button" class="btn btn-view-img btn-sm" onclick="event.stopPropagation(); viewCatalogImage('${escapeHtml(p.part_id)}')" title="Buka gambar fullscreen (zoom +/-)" aria-label="Lihat gambar ${escapeHtml(p.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Gambar</button>`
                  : `<button type="button" class="btn btn-ghost btn-sm" disabled title="Belum ada foto">No Foto</button>`}
              </div>
            </div>
          </article>
        `).join('');
      } catch (e) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-ill">⚠️</div><h3>Gagal memuat data</h3><p>${escapeHtml(e.message || 'Pastikan server backend berjalan')}</p></div>`;
      }
    }

    function filterByStock(filter, el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderCatalog(filter);
    }

    const _deb = debounce(() => renderCatalog(), 300);
    document.getElementById('catalog-search')?.addEventListener('input', _deb);
    document.getElementById('catalog-search-m')?.addEventListener('input', (e) => {
      const d = document.getElementById('catalog-search');
      if (d) d.value = e.target.value;
      _deb();
    });

    async function showDetail(partId) {
      selectedPartId = partId;
      try {
        const p = await apiRequest(`/spareparts/${encodeURIComponent(partId)}`);
        // Sinkronkan cache agar tombol gambar tidak perlu kirim URL via onclick.
        const ci = catalogCache.findIndex((x) => String(x.part_id) === String(p.part_id));
        if (ci >= 0) catalogCache[ci] = { ...catalogCache[ci], ...p };
        else catalogCache.push(p);
        document.getElementById('detailModalBody').innerHTML = `
          <div style="text-align:center; margin-bottom:1.25rem">
            <div class="detail-photo">
              ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" onerror="this.remove()">` : '<svg viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="1.5" width="48" height="48"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>'}
            </div>
            ${p.image_url ? `<button type="button" class="btn btn-view-img btn-sm" onclick="viewCatalogImage(selectedPartId)" title="Buka gambar fullscreen — terpisah dari popup ini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="21 3 14 10"/><line x1="21" y1="14" x2="21" y2="21"/></svg>Lihat Gambar Fullscreen</button>` : '<div style="font-size:0.8rem;color:var(--gray-400)">Belum ada foto</div>'}
            <div class="badge badge-primary" style="margin-bottom:0.5rem">${escapeHtml(p.part_id)}</div>
            <h3 style="font-size:1.2rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:0.25rem">${escapeHtml(p.name)}</h3>
            <div style="color:var(--gray-500); font-size:0.875rem">${escapeHtml(p.description || '')}</div>
          </div>
          <div class="divider"></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem">
            <div>
              <div style="font-size:0.72rem; color:var(--gray-400); text-transform:uppercase; font-weight:700; letter-spacing:0.06em; margin-bottom:0.25rem">Lokasi Rak</div>
              <div style="font-weight:700; display:flex; align-items:center; gap:0.375rem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${escapeHtml(p.location)}
              </div>
            </div>
            <div>
              <div style="font-size:0.72rem; color:var(--gray-400); text-transform:uppercase; font-weight:700; letter-spacing:0.06em; margin-bottom:0.25rem">Stok Tersedia</div>
              <div style="font-weight:800; font-size:1.5rem; letter-spacing:-0.02em; color:${p.current_stock <= 3 ? 'var(--danger-deep)' : 'var(--success-deep)'}">
                ${formatNumber(p.current_stock)} <span style="font-size:0.85rem; font-weight:500; color:var(--gray-500)">unit</span>
              </div>
            </div>
          </div>
        `;

        document.getElementById('takePartBtn').disabled = p.current_stock <= 0;
        if (p.current_stock <= 0) {
          document.getElementById('takePartBtn').textContent = 'Stok Habis';
        } else {
          document.getElementById('takePartBtn').textContent = 'Ambil Barang';
        }
        openModal('detailModal');
      } catch (e) {
        showToast('Gagal memuat detail sparepart', 'error');
      }
    }

    // Tombol gambar SENDIRI, terpisah dari popup detail: buka lightbox fullscreen.
    // Tidak menutup/menumpuk detailModal — lightbox hidup di layer sendiri (z-index 300).
    function viewCatalogImage(partId) {
      const p = catalogCache.find((x) => String(x.part_id) === String(partId));
      if (!p || !p.image_url) { showToast('Sparepart ini belum memiliki foto', 'warning'); return; }
      openImageLightbox(p.image_url, p.name, `${p.part_id} • ${p.location} • Stok ${p.current_stock}`);
    }

    async function openTakeModal() {
      closeModal('detailModal');
      try {
        const p = await apiRequest(`/spareparts/${selectedPartId}`);
        document.getElementById('takePartName').value = p.name;
        document.getElementById('takeQty').value = 1;
        document.getElementById('takeQty').max = p.current_stock;
        document.getElementById('takeNotes').value = '';
        openModal('takeModal');
      } catch (e) {
        showToast('Gagal memuat data sparepart', 'error');
      }
    }

    async function submitTake() {
      const qty = parseInt(document.getElementById('takeQty').value);
      const notes = document.getElementById('takeNotes').value.trim();

      if (!qty || qty < 1) { showToast('Jumlah harus lebih dari 0', 'error'); return; }
      if (!notes) { showToast('Keterangan wajib diisi', 'error'); return; }

      try {
        await takePart({ part_id: selectedPartId, quantity: qty, notes });
        closeModal('takeModal');
        showToast(`Berhasil mencatat pengambilan ${qty} barang`, 'success');
        renderCatalog();
      } catch (e) {
        showToast(e.message || 'Gagal mencatat pengambilan', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => renderCatalog());
  </script>
</body>
</html>
